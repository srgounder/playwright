name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: CarePro environment name
        required: true
        default: shqa
        type: string
      tag:
        description: Playwright test tag to run
        required: true
        default: '@NoTouch'
        type: string
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        TEST_ENV: ${{ github.event.inputs.environment || 'shqa' }}
        TEST_TAG: ${{ github.event.inputs.tag }}
      run: |
        if [ -n "$TEST_TAG" ]; then
          npx playwright test --project=chromium --grep "$TEST_TAG"
        else
          npx playwright test
        fi
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-run-${{ github.run_number }}-${{ github.run_attempt }}
        path: |
          playwright-report/
          test-results/results.json
        retention-days: 90
